<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060813">
  <title>Future Legacy | Mentorship, AI Education & Agro Innovation</title>
  <meta name="description" content="Future Legacy is India's all-in-one mentorship and innovation platform. Learn from IAS, Doctors, Engineers, modern agriculture, and get real guidance.">
  <script>
    window.process = window.process || { env: {} };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            montserrat: ['Montserrat', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <script src="https://checkout.razorpay.com/v1/checkout.js" async defer></script>
  <style>
    :root { 
      --bg-page: #060813; 
      --card-bg: #0b0f1f; 
      --border-subtle: rgba(255,255,255,0.08);
      --accent-indigo: #6366f1;
    }
    
    html, body {
      min-height: 100%;
      height: auto;
      background-color: #060813;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
      overscroll-behavior-y: auto;
      background: #060813;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 0%, #0d1530 0%, #060813 60%, #03040a 100%);
    }

    body { 
      color: #f8fafc; 
      font-family: 'Inter', sans-serif; 
      background-color: #060813;
      -webkit-font-smoothing: antialiased;
    }
    
    h1, h2, h3 { font-family: 'Montserrat', sans-serif !important; letter-spacing: -0.03em !important; }
    
    /* Universal sleek, elegant dark scrollbar across all devices & browsers */
    html, body, *, *::before, *::after {
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 102, 241, 0.45) rgba(15, 23, 42, 0.4);
    }

    ::-webkit-scrollbar,
    *::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track,
    *::-webkit-scrollbar-track {
      background: rgba(8, 13, 30, 0.5) !important;
    }

    ::-webkit-scrollbar-thumb,
    *::-webkit-scrollbar-thumb {
      background-color: rgba(99, 102, 241, 0.4);
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    ::-webkit-scrollbar-thumb:hover,
    *::-webkit-scrollbar-thumb:hover {
      background-color: rgba(129, 140, 248, 0.8);
    }

    ::-webkit-scrollbar-corner,
    *::-webkit-scrollbar-corner {
      background: transparent !important;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent !important; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.45); border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(129, 140, 248, 0.85); }

    .kinetic-scroll {
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch !important;
      scroll-behavior: smooth;
      overscroll-behavior-y: auto;
      touch-action: pan-y;
    }

    .glow-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(11, 15, 31, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .glow-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.25);
    }

    .glow-emerald-card {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.15) 0%, rgba(11, 15, 31, 0.95) 100%);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .glow-emerald-card:hover {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 20px 40px -15px rgba(16, 185, 129, 0.3);
    }

    .glow-amber-card {
      background: linear-gradient(135deg, rgba(120, 53, 15, 0.15) 0%, rgba(11, 15, 31, 0.95) 100%);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .glow-amber-card:hover {
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 20px 40px -15px rgba(245, 158, 11, 0.3);
    }

    .glass-node {
      background: rgba(11, 15, 31, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    @keyframes toast-in-out {
      0% { transform: translate(-50%, -100%); opacity: 0; }
      15% { transform: translate(-50%, 20px); opacity: 1; }
      85% { transform: translate(-50%, 20px); opacity: 1; }
      100% { transform: translate(-50%, -100%); opacity: 0; }
    }
    .animate-toast-in-out { animation: toast-in-out 3.5s forwards ease-in-out; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
